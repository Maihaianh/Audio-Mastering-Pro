name: Build AM-MHA Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-core build-essential ccache git libncurses5:i386 libstdc++6:i386 \
          libz1:i386 zlib1g-dev libffi-dev libssl-dev patchelf \
          python3-pip python3-dev python3-setuptools python3-virtualenv \
          openjdk-17-jdk unzip wget curl autoconf libtool pkg-config

    - name: Install Python build tools
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: am-mha-pro-apk
        path: bin/*.apk
